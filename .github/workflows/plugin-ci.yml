name: BJTU Plugin CI

on:
  push:
    paths:
      - "plugin/**"
      - "dist/**"
      - "package.json"
      - "package-lock.json"
      - "bjtu-plugin.json"
      - "bjtu-plugin.dev.json"
      - "bjtu-marketplace.json"
      - ".github/workflows/plugin-ci.yml"
  pull_request:
    paths:
      - "plugin/**"
      - "dist/**"
      - "package.json"
      - "package-lock.json"
      - "bjtu-plugin.json"
      - "bjtu-plugin.dev.json"
      - "bjtu-marketplace.json"
      - ".github/workflows/plugin-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  BJTU_HOST_COMMIT: 06f2b03a4cda4ad1b9d19fea01e8065808659044

jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Unit and integration tests
        run: npm test

      - name: Build committed static package
        run: npm run build

      - name: Verify committed dist is reproducible
        run: npm run check:dist

      - name: Check repository package limits
        run: npm run check:package

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser regression without DOM storage
        run: npm run test:e2e

      - name: Check out pinned BJTU MIS host
        uses: actions/checkout@v4
        with:
          repository: wan300/bjtu_mis_Android
          ref: ${{ env.BJTU_HOST_COMMIT }}
          path: .bjtu-host

      - name: Build official tooling at pinned SHA
        working-directory: .bjtu-host/plugin-tooling
        run: |
          npm ci
          npm run build

      - name: Run official contract checks
        run: |
          CLI=.bjtu-host/plugin-tooling/packages/plugin-cli/dist/bin.js
          node "$CLI" lint . --source
          node "$CLI" lint . --marketplace
          node "$CLI" test .
          node "$CLI" inspect .
          node "$CLI" doctor .

      - name: Verify deterministic official pack
        run: |
          CLI=.bjtu-host/plugin-tooling/packages/plugin-cli/dist/bin.js
          node "$CLI" pack . --out plugin-a.zip
          node "$CLI" pack . --out plugin-b.zip
          cmp plugin-a.zip plugin-b.zip
          if unzip -Z1 plugin-a.zip | grep -Fxq bjtu-plugin.dev.json; then
            echo "bjtu-plugin.dev.json leaked into release package" >&2
            exit 1
          fi
          sha256sum plugin-a.zip

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JM_OPTION_PATH_TEST: ./assets/option/option_test_api.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python project
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Run existing Python tests
        working-directory: tests
        run: python -m unittest
      - name: Build Python distributions outside plugin dist
        run: python -m build --outdir python-dist
